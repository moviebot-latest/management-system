<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Management System - Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="auth"><section class="card">
<div class="logo">MS</div><h1>Management System</h1><p>Login to continue</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post" action="/login"><label>Username</label><input name="username" required>
<label>Password</label><input name="password" type="password" required><button>Login</button></form>
<a href="/register">New user? Create an account</a>
</section></main></body></html>
