<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account | Management System</title>
  <meta name="description" content="Create your Management System account securely.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Create Account | Management System">
  <meta property="og:description" content="Create a secure Management System account.">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' fill='white'%3EMS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="auth">
  <section class="card register-card">
    <h1>Create Account</h1>
    <p class="register-subtitle">Registration Page</p>

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for category,message in messages %}
        <div class="msg {{category}}">{{message}}</div>
      {% endfor %}
    {% endwith %}

    <form id="registerForm" method="post" action="{{ url_for('register') }}" onsubmit="return validateRegistration()">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <label>Full Name</label>
      <input name="name" autocomplete="name" required>

      <label>Gender</label>
      <select name="gender" required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label>Department</label>
      <select name="department" required>
        <option value="">Select department</option>
        <option>Administration</option>
        <option>Human Resources</option>
        <option>Finance</option>
        <option>Sales</option>
        <option>IT / Engineering</option>
        <option>Operations</option>
      </select>

      <label>Email / Gmail</label>
      <input name="email" type="email" autocomplete="email" placeholder="name@gmail.com" required>

      <label>Username</label>
      <input name="username" autocomplete="new-password" placeholder="Create username" required>

      <label>Password</label>
      <div class="password-box">
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create password" minlength="6" required oninput="checkPassword()">
        <button type="button" class="eye-btn" onclick="togglePassword('password', this)" aria-label="Show password">👁</button>
      </div>
      <div class="strength" id="passwordStrength" aria-live="polite" style="display:none">
        <div class="strength-bars"><i></i><i></i><i></i><i></i></div>
        <small id="strengthText">Weak</small>
      </div>

      <label>Confirm Password</label>
      <div class="password-box">
        <input id="confirmPassword" name="confirm" type="password" autocomplete="new-password" placeholder="Confirm password" minlength="6" required>
        <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword', this)" aria-label="Show password">👁</button>
      </div>
      <small id="confirmError" class="field-error"></small>

      <button class="primary-btn register-submit" type="submit">Register</button>
    </form>

    <div class="login-back">Already have an account? <a href="/">Login</a></div>
  </section>
</main>
<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function validateRegistration() {
  const p = document.getElementById('password').value;
  const c = document.getElementById('confirmPassword').value;
  const error = document.getElementById('confirmError');
  if (p !== c) {
    error.textContent = 'Passwords do not match.';
    document.getElementById('confirmPassword').focus();
    return false;
  }
  error.textContent = '';
  return true;
}
document.getElementById('confirmPassword').addEventListener('input', function() {
  const p = document.getElementById('password').value;
  document.getElementById('confirmError').textContent = this.value && p !== this.value ? 'Passwords do not match.' : '';
});

function checkPassword() {
  const password = document.getElementById('password').value;
  const box = document.getElementById('passwordStrength');
  const bars = box.querySelectorAll('.strength-bars i');
  const text = document.getElementById('strengthText');
  bars.forEach(b => b.className = '');
  if (!password) { box.style.display = 'none'; return; }
  box.style.display = 'block';

  let score = 0;
  if (password.length >= 6) score++;
  if (password.length >= 10) score++;
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
  if (/\d/.test(password) && /[^A-Za-z0-9]/.test(password)) score++;

  const labels = ['Weak', 'Medium', 'Strong', 'Very Strong'];
  const classes = ['weak', 'medium', 'strong', 'very-strong'];
  const level = Math.max(1, Math.min(score, 4));
  for (let i = 0; i < level; i++) bars[i].classList.add(classes[level - 1]);
  text.textContent = labels[level - 1];
  text.className = classes[level - 1];
}
</script>
</body>
</html>
