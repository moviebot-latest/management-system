<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Management System - Registration</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="auth"><section class="card wide">
<div class="logo">MS</div><h1>Create Account</h1><p>Registration Page</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><div class="grid">
<div><label>Full Name</label><input name="name" required></div>
<div><label>Gender</label><select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label>Department</label><select name="department" required><option value="">Select</option><option>Administration</option><option>Human Resources</option><option>Finance</option><option>Sales</option><option>IT / Engineering</option><option>Operations</option></select></div>
<div><label>Email</label><input name="email" type="email" required></div>
<div><label>Username</label><input name="username" required></div>
<div>
<label>Password</label>
<div class="password-box">
<input id="password" name="password" type="password" minlength="6" required oninput="checkPassword()">
<button type="button" class="eye-btn" onclick="togglePassword('password', this)" aria-label="Show password">👁</button>
</div>
<div class="strength" id="passwordStrength" aria-live="polite" style="display:none">
<div class="strength-bars"><i></i><i></i><i></i><i></i></div>
<small id="strengthText">Weak</small>
</div>
</div>
<div class="full">
<label>Confirm Password</label>
<div class="password-box">
<input id="confirmPassword" name="confirm" type="password" minlength="6" required>
<button type="button" class="eye-btn" onclick="togglePassword('confirmPassword', this)" aria-label="Show password">👁</button>
</div>
</div>
</div><button>Register</button></form>
<a href="/">Already have an account? Login</a></section></main><script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function checkPassword() {
  const password = document.getElementById('password').value;
  const box = document.getElementById('passwordStrength');
  const bars = box.querySelectorAll('.strength-bars i');
  const text = document.getElementById('strengthText');
  bars.forEach(b => b.className = '');
  if (!password) { box.style.display = 'none'; return; }
  box.style.display = 'block';

  let score = 0;
  if (password.length >= 6) score++;
  if (password.length >= 10) score++;
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
  if (/\d/.test(password) && /[^A-Za-z0-9]/.test(password)) score++;

  const labels = ['Weak', 'Medium', 'Strong', 'Very Strong'];
  const classes = ['weak', 'medium', 'strong', 'very-strong'];
  const level = Math.max(1, Math.min(score, 4));
  for (let i = 0; i < level; i++) bars[i].classList.add(classes[level - 1]);
  text.textContent = labels[level - 1];
  text.className = classes[level - 1];
}
</script>
</body></html>
