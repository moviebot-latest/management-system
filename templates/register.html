<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | Library Management System</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="auth"><section class="card register-card">
<h1>📚 Create Account</h1><p class="register-subtitle">Library Member Registration</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post" action="{{ url_for('register') }}" onsubmit="return validateRegistration()">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
<label>Full Name</label><input name="name" autocomplete="name" required>
<label>Gender</label><select name="gender" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select>
<label>Email / Gmail</label><input name="email" type="email" autocomplete="email" placeholder="name@gmail.com" required>
<label>Username</label><input name="username" autocomplete="username" placeholder="Create username" required>
<label>Password</label><div class="password-box"><input id="password" name="password" type="password" minlength="6" required><button type="button" class="eye-btn" onclick="togglePassword('password',this)">👁</button></div>
<label>Confirm Password</label><div class="password-box"><input id="confirmPassword" name="confirm" type="password" minlength="6" required><button type="button" class="eye-btn" onclick="togglePassword('confirmPassword',this)">👁</button></div>
<small id="confirmError" class="field-error"></small>
<button class="primary-btn register-submit" type="submit">Create Member Account</button></form>
<div class="login-back">Already have an account? <a href="/">Login</a></div>
</section></main>
<script>
function togglePassword(id,b){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'👁':'🙈'}
function validateRegistration(){let p=password.value,c=confirmPassword.value;if(p!==c){confirmError.textContent='Passwords do not match.';return false}confirmError.textContent='';return true}
</script></body></html>
