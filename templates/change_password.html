<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password | Library Management System</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="auth"><section class="card login-card"><h1>🔐 Change Password</h1><p>Update your library account password.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="_csrf_token" value="{{csrf_token}}">
<label>Current Password</label><input name="current_password" type="password" required>
<label>New Password</label><input name="new_password" type="password" minlength="6" required>
<label>Confirm New Password</label><input name="confirm_password" type="password" minlength="6" required>
<button class="primary-btn" type="submit">Change Password</button></form><div class="register-link"><a href="/dashboard">← Back to Dashboard</a></div></section></main></body></html>
