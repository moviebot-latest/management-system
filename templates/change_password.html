<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Change Password | Management System</title>
  <meta name="description" content="Change your Management System password securely.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' fill='white'%3EMS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="auth">
  <section class="card">
    <div class="logo">MS</div>
    <h1>Change Password</h1>
    <p>Verify your current password and set a new one.</p>

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for category,message in messages %}<div class="msg {{category}}">{{message}}</div>{% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}"> action="/change-password">
      <label>Username</label>
      <input name="username" required autocomplete="username">

      <label>Current Password</label>
      <div class="password-box">
        <input id="currentPassword" name="current_password" type="password" required>
        <button type="button" class="eye-btn" onclick="togglePassword('currentPassword','currentEye')"><span id="currentEye">👁️</span></button>
      </div>

      <label>New Password</label>
      <div class="password-box">
        <input id="newPassword" name="new_password" type="password" minlength="6" required oninput="checkStrength()">
        <button type="button" class="eye-btn" onclick="togglePassword('newPassword','newEye')"><span id="newEye">👁️</span></button>
      </div>

      <div class="strength">
        <div class="strength-bars"><i></i><i></i><i></i><i></i></div>
        <small id="strengthText">Enter password</small>
      </div>

      <label>Confirm Password</label>
      <div class="password-box">
        <input id="confirmPassword" name="confirm_password" type="password" minlength="6" required>
        <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword','confirmEye')"><span id="confirmEye">👁️</span></button>
      </div>

      <button class="primary-btn" type="submit">Change Password</button>
    </form>
    <a class="forgot-link" href="/">Back to Login</a>
  </section>
</main>
<script>
function togglePassword(id, eyeId){
  const input=document.getElementById(id), eye=document.getElementById(eyeId);
  input.type=input.type==='password'?'text':'password';
  eye.textContent=input.type==='password'?'👁️':'🙈';
}
function checkStrength(){
  const p=document.getElementById('newPassword').value;
  const bars=document.querySelectorAll('.strength-bars i');
  const text=document.getElementById('strengthText');
  bars.forEach(x=>x.className='');
  if(!p){text.textContent='Enter password';return;}
  let score=0;
  if(p.length>=6)score++;
  if(p.length>=10)score++;
  if(/[A-Z]/.test(p)&&/[0-9]/.test(p))score++;
  if(/[^A-Za-z0-9]/.test(p))score++;
  const names=['','Weak','Medium','Strong','Very Strong'];
  const cls=['','weak','medium','strong','very-strong'];
  text.textContent='Password strength: '+names[score];
  for(let i=0;i<score;i++)bars[i].classList.add(cls[score]);
}
</script>
</body>
</html>
