<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Management System</title>
  <meta name="description" content="Secure login for the Management System.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Login | Management System">
  <meta property="og:description" content="Secure Management System login.">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' fill='white'%3EMS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="auth">
  <section class="card login-card">
    <div class="logo">MS</div>
    <h1>Management System</h1>
    <p>Welcome back! Please login to your account.</p>

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for category,message in messages %}
        <div class="msg {{category}}">{{message}}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}"> action="/login">
      <label>Username</label>
      <input name="username" autocomplete="username" required>

      <label>Password</label>
      <div class="password-box">
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="eye-btn" onclick="togglePassword('loginPassword','loginEye')">
          <span id="loginEye">👁️</span>
        </button>
      </div>

      <button class="primary-btn" type="submit">Login</button>
    </form>

    <a class="forgot-link" href="/change-password">Forgot Password?</a>
    <div class="register-link">Don't have an account? <a href="/register">Create Account</a></div>
  </section>
</main>
<script>
function togglePassword(id, eyeId){
  const input=document.getElementById(id), eye=document.getElementById(eyeId);
  input.type=input.type==='password'?'text':'password';
  eye.textContent=input.type==='password'?'👁️':'🙈';
}
</script>
</body>
</html>
