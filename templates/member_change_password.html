<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Member Password</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="library-page modern-library"><main class="content modern-content" style="margin-left:0;max-width:680px"><div class="member-password-dialog" style="margin:40px auto"><small>ADMIN MEMBER MANAGEMENT</small><h3>Change Password</h3><p>Set a new password for <strong>{{ member.name }}</strong>.</p><form method="post" action="{{ url_for('admin_change_member_password',user_id=member.id) }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>New Password</label><input name="new_password" type="password" minlength="6" required><label>Confirm Password</label><input name="confirm_password" type="password" minlength="6" required><button type="submit">Update Password</button></form><a href="{{ url_for('dashboard') }}" style="display:block;text-align:center;margin-top:15px">← Back to Member List</a></div></main></body></html>
